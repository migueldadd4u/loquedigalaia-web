# Ingesta efímera y despliegue a producción (Cloudflare Workers Static Assets).
#
# Tres caminos:
#   1. push de código a main — reconstruye y publica la web.
#   2. schedule — restaura el último checkpoint público, descarga el pulso,
#      valida, reconstruye y publica sin crear commits en data/**.
#   3. workflow_dispatch — botón manual «Run workflow».
#
# El despliegue es el último paso. Si restauración, snapshot o cualquier gate
# falla, Wrangler no se ejecuta y producción conserva íntegra la versión previa.

name: Deploy producción

on:
  push:
    branches: [main]
    # Estos cuatro ficheros son únicamente el fallback de arranque del repo. El
    # workflow nunca los commitea; ignorarlos evita revivir el modelo antiguo.
    paths-ignore:
      - 'data/pulso.json'
      - 'data/history.json'
      - 'data/source-status.json'
      - 'data/pending.json'
  schedule:
    # GitHub usa UTC. Tres refrescos al día: la primera pasada (04:15 UTC =
    # 05:15 CET / 06:15 CEST) queda siempre después del productor de ClonMAD,
    # programado a las 03:43 Europe/Madrid; las de mediodía y tarde recogen
    # publicaciones extraordinarias del frontal y cubren un schedule que
    # GitHub retrase o se salte. Sin datos nuevos son idempotentes: el
    # checkpoint restaurado hace que se republique exactamente lo mismo.
    - cron: '15 4,10,16 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PULSO_STATE_URL: https://loquedigalaia.com/pulso-state.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restaurar último checkpoint válido
        run: npm run pulso:restore

      - name: Descargar, validar y confirmar el pulso nuevo
        run: npm run snapshot:daily

      # gate = lint + build estático + tests HTML/a11y/SEO + checkpoint dentro
      # de out/. No hay git add, commit ni push: data/** vive solo en el runner.
      - name: Lint, tests, build y checkpoint
        run: npm run gate

      - name: Guardián y deploy atómico
        run: npm run deploy:out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
